version: 2

# Pinning actions to SHAs means nothing arrives automatically — including
# security fixes. Dependabot is what keeps the pins from going stale.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(deps)'

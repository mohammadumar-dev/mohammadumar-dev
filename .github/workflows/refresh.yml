name: Refresh profile panels

on:
  push:
    branches: [main]
    # Only the inputs to the render need to trigger a rebuild. Without this the
    # bot's own commit to assets/ would re-enter the workflow.
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
      - 'assets/fonts/**'
  # Rebuild once a day so the calendar and counters stay current.
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

# Least privilege by default. The single job that needs to commit widens this
# for itself; every other job runs read-only.
permissions:
  contents: read

# The job commits, so two runs overlapping would race each other.
concurrency:
  group: panels
  cancel-in-progress: false

jobs:
  # Renders the panels with a read-only token. This is the half of the workflow
  # that runs third-party code (npm-free, but fonttools and a Python helper) and
  # parses JSON from GitHub's API and an outside contributions mirror. Nothing in
  # here can write to the repository: the writable token lives in `commit`, which
  # touches neither the network nor any dependency.
  render:
    runs-on: ubuntu-latest
    # A fork inherits the schedule but not the profile it describes, so the run
    # would burn minutes to render someone else's name.
    if: github.repository == 'mohammadumar-dev/mohammadumar-dev'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs: a tag like @v4 is mutable, and this
      # workflow holds a token that can write to the default branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config. The render step talks to a
          # third-party API, and a persisted credential is one bad dependency
          # away from being exfiltrated.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # fonttools subsets Mona Sans down to the glyphs the panels draw so it can
      # be inlined as a data URI. Without it the panels fall back to the system
      # font stack rather than failing.
      - name: Install fonttools
        run: |
          pip install --disable-pip-version-check --require-hashes \
            --no-deps --only-binary=:all: -r scripts/requirements.txt

      - name: Render panels
        env:
          # Read-only here: this job's permissions cap what the token can do, so
          # the GraphQL commit-history and language queries work and nothing else
          # does. Being the repo's own installation token rather than a personal
          # one, it sees public contributions only — which is the right sample for
          # a public profile, and is why the dial can be regenerated by anyone who
          # forks this without handing them a credential.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-readme-assets.mjs

      # Only the panels cross the job boundary. README.md deliberately does not:
      # `commit` re-derives its cache keys itself, so a render that went wrong
      # cannot hand over arbitrary README content to be committed.
      - name: Upload panels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panels
          path: assets/*.svg
          if-no-files-found: error
          retention-days: 1

  # Holds the writable token. Installs nothing, fetches nothing, and accepts only
  # four known filenames out of the render's artifact.
  commit:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download panels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: panels
          path: .panels

      # Copy by name rather than by glob: an artifact carrying an extra file
      # cannot introduce one into assets/, and a missing panel fails the run
      # instead of silently committing three.
      - name: Apply panels
        run: |
          set -euo pipefail
          for name in clock signal; do
            for theme in dark light; do
              src=".panels/${name}-${theme}.svg"
              if [ ! -f "$src" ]; then
                echo "missing panel: $src" >&2
                exit 1
              fi
              # Each panel inlines a few subset font faces; anything near a
              # megabyte is not a panel this repo renders.
              size=$(wc -c < "$src")
              if [ "$size" -gt 1048576 ]; then
                echo "panel too large: $src ($size bytes)" >&2
                exit 1
              fi
              cp -- "$src" "assets/${name}-${theme}.svg"
            done
          done
          rm -rf .panels

      # Run from the checked-out scripts, not from anything the render produced.
      # Stamping only hashes the local SVGs and rewrites the ?v= keys already in
      # the README, so README.md cannot change in any other way.
      - name: Restamp README cache keys
        run: node scripts/build-readme-assets.mjs --stamp-only

      - name: Commit if anything changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets README.md
          if git diff --cached --quiet; then
            echo 'panels unchanged'
            exit 0
          fi
          # Belt and braces over the copy allowlist above: nothing outside the
          # panels and the README's cache keys may ride along in this commit.
          unexpected=$(git diff --cached --name-only \
            | grep -vE '^(README\.md|assets/(clock|signal)-(dark|light)\.svg)$' || true)
          if [ -n "$unexpected" ]; then
            echo "refusing to commit unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git commit -m 'chore: refresh profile panels [skip ci]'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"

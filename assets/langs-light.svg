<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="166" viewBox="0 0 1000 166" role="img" aria-label="Language breakdown by bytes: Go 62.82 percent, JavaScript 26.44 percent, TypeScript 10.65 percent" font-family="&#39;Mona Sans&#39;, ui-sans-serif, system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif">
  <title>Language breakdown by bytes: Go 62.82 percent, JavaScript 26.44 percent, TypeScript 10.65 percent</title>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(31,35,40,.05)" stop-opacity="0"/>
      <stop offset=".5" stop-color="rgba(31,35,40,.05)"/>
      <stop offset="1" stop-color="rgba(31,35,40,.05)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1d9e0"/>
      <stop offset="1" stop-color="#d1d9e0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom0">
      <stop offset="0" stop-color="#54aeff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#54aeff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom1">
      <stop offset="0" stop-color="#c297ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c297ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2">
      <stop offset="0" stop-color="#ff9bce" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff9bce" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pane"><rect x="1" y="1" width="998" height="164" rx="20"/></clipPath>
    <clipPath id="barclip"><rect x="40" y="100" width="920" height="12" rx="6"/></clipPath>
  </defs>
  <style>

    text{white-space:pre}
    .sweep{animation:sweep 9s ease-in-out infinite}
    @keyframes sweep{
      0%,100%{transform:translateX(0);opacity:0}
      45%{opacity:1}
      100%{transform:translateX(1600px)}
    }
    .cell{transform-box:fill-box;transform-origin:center}
    .live .cell{animation:cell-in .5s cubic-bezier(.22,.8,.3,1) both}
    @keyframes cell-in{from{opacity:0;transform:scale(.35) translateY(4px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:left center;animation:bar-in .9s cubic-bezier(.22,.8,.3,1) both}
    @keyframes bar-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){
      .sweep{animation:none;opacity:0}
      .live .cell,.bar{animation:none}
    }
  </style>
  <rect x="1" y="1" width="998" height="164" rx="20" fill="url(#surface)"/>
  <g clip-path="url(#pane)">
    <ellipse cx="140" cy="17" rx="420" ry="260" fill="url(#bloom0)"/><ellipse cx="780" cy="103" rx="360" ry="223" fill="url(#bloom1)"/><ellipse cx="450" cy="174" rx="340" ry="211" fill="url(#bloom2)"/>
    <rect class="sweep" x="-500" y="0" width="500" height="166" fill="url(#sweep)"/>
  </g>
  <rect x="1.5" y="1.5" width="997" height="163" rx="19.5" fill="none" stroke="rgba(31,35,40,.14)"/>
  <path d="M 20 2 H 980" stroke="rgba(255,255,255,.9)" stroke-width="1" fill="none" opacity=".5"/>
  <text x="40" y="46" font-family="&#39;Mona Sans Mono&#39;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#818b98">LANGUAGES</text>
  <text x="960" y="46" text-anchor="end" font-family="&#39;Mona Sans Mono&#39;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#818b98">by bytes across public repos</text>
  <circle cx="46" cy="74" r="6" fill="#00ADD8"/>
  <text x="60" y="79" font-size="21" font-weight="800" letter-spacing="-.3" fill="#1f2328">Go</text>
  <text x="92.3" y="79" font-family="&#39;Mona Sans Mono&#39;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#59636e">62.8% of 3 languages</text>
  <rect x="40" y="100" width="920" height="12" rx="6" fill="#ffffff" stroke="rgba(31,35,40,.09)"/>
  <g class="bar" clip-path="url(#barclip)">
    <rect x="40.00" y="100" width="578.46" height="12" fill="#00ADD8"/>
    <rect x="618.46" y="100" width="243.47" height="12" fill="#f1e05a"/>
    <rect x="861.93" y="100" width="98.07" height="12" fill="#3178c6"/>
  </g>
  <circle cx="44.0" cy="136" r="4" fill="#00ADD8"/>
  <text x="54.0" y="140" font-family="&#39;Mona Sans Mono&#39;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636e">Go 62.8%</text>
  <circle cx="133.2" cy="136" r="4" fill="#f1e05a"/>
  <text x="143.2" y="140" font-family="&#39;Mona Sans Mono&#39;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636e">JavaScript 26.4%</text>
  <circle cx="277.6" cy="136" r="4" fill="#3178c6"/>
  <text x="287.6" y="140" font-family="&#39;Mona Sans Mono&#39;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636e">TypeScript 10.7%</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="214" viewBox="0 0 1048 214" role="img" aria-label="Language breakdown by bytes: Java 54.7 percent, TypeScript 25.0 percent, Other 7.6 percent, JavaScript 5.7 percent, Go 4.4 percent, Python 2.6 percent" font-family="&#39;Mona Sans&#39;, ui-sans-serif, system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif">
  <title>Language breakdown by bytes: Java 54.7 percent, TypeScript 25.0 percent, Other 7.6 percent, JavaScript 5.7 percent, Go 4.4 percent, Python 2.6 percent</title>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.72)"/>
      <stop offset="1" stop-color="rgba(255,255,255,.44)"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.95)"/>
      <stop offset=".38" stop-color="rgba(0,0,0,.13)"/>
      <stop offset=".72" stop-color="rgba(0,0,0,.13)" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="specular" cx=".18" cy="0" r=".8">
      <stop offset="0" stop-color="rgba(255,255,255,.85)"/>
      <stop offset="1" stop-color="rgba(255,255,255,.85)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(31,35,40,.05)" stop-opacity="0"/>
      <stop offset=".5" stop-color="rgba(31,35,40,.05)"/>
      <stop offset="1" stop-color="rgba(31,35,40,.05)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8d8de"/>
      <stop offset="1" stop-color="#d8d8de" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom0">
      <stop offset="0" stop-color="rgba(60,60,67,.10)"/>
      <stop offset="1" stop-color="rgba(60,60,67,.10)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom1">
      <stop offset="0" stop-color="rgba(60,60,67,.07)"/>
      <stop offset="1" stop-color="rgba(60,60,67,.07)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2">
      <stop offset="0" stop-color="rgba(60,60,67,.05)"/>
      <stop offset="1" stop-color="rgba(60,60,67,.05)" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
